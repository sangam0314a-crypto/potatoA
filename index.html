    var clean = function (el) { return el ? el.innerHTML.replace(/<br[^>]*>/gi, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim() : ''; };
    return {
      worries: $$('#chat .chat-item').filter(function (l) { var i = $('input', l); return i && i.checked; }).map(function (l) { return clean($('.tx', l)); }).join(' / '),
      cases: $$('#caseGrid .case[aria-pressed="true"]').map(function (c) { return clean($('.case-title', c)); }).join(' / '),
      worlds: ['inner', 'outer'].filter(function (k) { return state.worlds[k]; }).map(function (k) { return k === 'inner' ? 'INNER ME' : 'OUTER ME'; }).join(' / ')
    };
  }

  function renderPicksNote() {
    var pk = landingPicks(), n = [pk.worries, pk.cases, pk.worlds].filter(Boolean).join(' / ').split(' / ').filter(Boolean).length, el = $('#picksNote');
    if (!el) return;
    el.hidden = !n;
    if (n) el.innerHTML = '✓ 위에서 체크한 고민·공감 항목 <b>' + n + '개</b>도 신청서와 함께 전달돼요.';
  }

  function payload() {
    var rd = regionData(), st = radioVal('status'), so = radioVal('source'), P = C.PRIVACY || {};
    var utm = {};
    if (C.CAPTURE_UTM) new URLSearchParams((window.__GAON_NAV && window.__GAON_NAV.search) || window.location.search).forEach(function (v, k) { if (/^utm_/i.test(k)) utm[k.toLowerCase()] = v.slice(0, 100); });
    return {
      project: C.PROJECT || 'potato_test',
      ab_variant: C.AB_VARIANT || '',
      submission_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2),
      submitted_at: new Date().toISOString(),
      name: $('#name').value.trim(),
      phone: $('#phone').value.trim(),
      birth_year: $('#birth').value.trim(),
      status: st, status_other: st === '기타' ? $('#statusOther').value.trim() : '',
      region: rd.region, region_sido: rd.sido, region_sigungu: rd.sigungu, region_gu: rd.gu, region_dong: rd.dong, region_text: rd.text,
      source: so, source_other: so === '기타' ? $('#sourceOther').value.trim() : '',
      referral: $('#referral').value.trim(),
      concern: $('#concern').value.trim(),
      consent: true, consent_version: P.consentVersion || '',
      potato_type: state.type || '',
      potato_type_name: state.type && TYPES[state.type] ? TYPES[state.type].name : '',
      // 랜딩에서 고른 항목 (신청할 때만 함께 전송)
      landing_worries: landingPicks().worries,
      landing_cases: landingPicks().cases,
      landing_worlds: landingPicks().worlds,
      utm: utm,
      website: $('#website').value // 허니팟: 사람은 비워둠
    };
  }

  function setLoading(on) {
    var b = F.btn; state.submitting = on; b.disabled = on; b.setAttribute('aria-busy', String(on));
    b.innerHTML = on ? '<span class="spin" aria-hidden="true"></span> 신청서 보내는 중…' : '프로젝트 신청하기 <span class="ar" aria-hidden="true">→</span>';
  }
  function alertBox(kind, html) {
    var a = $('#formAlert'); a.className = 'form-alert show ' + kind; a.innerHTML = html;
  }
  function clearAlert() { var a = $('#formAlert'); a.className = 'form-alert'; a.innerHTML = ''; }

  function onSubmit(e) {
    e.preventDefault();
    if (state.submitting || state.submitted) return;  // 중복 클릭 방지
    clearAlert();
    var errs = validate();
    showSummary(errs);
    if (errs.length) {
      trackEvent('form_submit_error', { reason: 'validation' });
      var first = errs[0], target = $(first.focus || ('#' + first.id));
      if (target) { target.focus({ preventScroll: true }); target.scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'center' }); }
      return;
    }
    if (!liveMode()) {
      trackEvent('form_submit_attempt', { mode: 'demo' });
      alertBox('demo', '<b>데모 상태라 신청이 접수되지 않았어요.</b><br>접수 시스템이 연결되면 같은 방식으로 신청할 수 있어요. 입력한 내용은 어디에도 전송되지 않았어요.<br>(미리보기용으로 아래에 결과 공개 화면을 보여드려요.)');
      revealResult();
      if (window.console) console.info('[GAON] 데모 모드 — 설정이 필요한 항목:', missingConfig().join(', '));
      return;
    }
    trackEvent('form_submit_attempt', { mode: 'live' });
    setLoading(true);
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, C.SUBMIT_TIMEOUT_MS || 15000);
    fetch(C.SUBMIT_ENDPOINT.trim(), {
      method: 'POST',
      headers: { 'Content-Type': C.SUBMIT_CONTENT_TYPE || 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload()),
      redirect: 'follow', credentials: 'omit', cache: 'no-store',
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      if (!res.ok) throw { reason: 'http_' + res.status };
      return res.json().catch(function () { throw { reason: 'bad_json' }; });
    }).then(function (json) {
      if (!json || json.ok !== true) throw { reason: 'not_ok', msg: json && json.message };
      clearTimeout(timer);
      onSuccess();
    }).catch(function (err) {
      clearTimeout(timer);
      setLoading(false);
      var reason = (err && err.reason) || (err && err.name === 'AbortError' ? 'timeout' : 'network');
      trackEvent('form_submit_error', { reason: reason });
      var msg = reason === 'timeout' ? '응답이 늦어지고 있어요. 네트워크 상태를 확인하고 다시 시도해주세요.'
        : reason === 'network' ? '네트워크 연결에 문제가 있어요. 잠시 후 다시 시도해주세요.'
        : '신청을 접수하지 못했어요. 잠시 후 다시 시도해주세요.';
      alertBox('err', '<b>신청이 접수되지 않았어요.</b><br>' + msg + (isUrl(C.OPENCHAT_URL) ? ' 계속 안 되면 문의하기로 알려주세요.' : ''));
    });
  }
  /* 신청을 마친 뒤 감자 유형 결과 공개 */
  function revealResult() {
    var box = $('#resultReveal'), k = state.type, t = k && TYPES[k];
    if (!t) {
      var tu = (C.TEST_URL || '').trim();
      box.innerHTML = '<div class="reveal-empty"><p class="k">YOUR POTATO TYPE</p><p>아직 감자 유형 테스트를 안 했다면,<br><b>2분 만에 내 관계 스타일을 알아봐!</b></p>' +
        (tu ? '<a class="cta cta-ghost" href="' + esc(tu) + '">감자 유형 테스트 하러 가기 <span class="ar" aria-hidden="true">→</span></a>' : '') + '</div>';
      box.hidden = false; return;
    }
    state.revealed = true;
    box.innerHTML =
      '<p class="reveal-k"><span class="kicker"><i aria-hidden="true"></i>🔓 UNLOCKED · YOUR POTATO TYPE</span></p>' +
      '<article class="profile result-card">' +
        '<div class="pf-top"><div class="stage"><span class="island">' + CHAR.island() + '</span><span class="char">' + CHAR.potato(typeLook(k, k === 'brave' || k === 'quiet' ? {} : { arms: 'wave' })) + '</span></div>' +
        '<div><p class="pf-lbl">MY POTATO · ' + esc(t.badge) + '</p><p class="pf-name">' + esc(t.name) + '</p><p class="pf-tag">' + esc(t.tag) + '</p></div></div>' +
        '<div class="pf-rows">' +
          '<div class="pf-row"><span class="tag tp">MY STYLE</span><p class="pf-desc">' + esc(t.desc) + '</p></div>' +
          '<div class="pf-row rc-grid"><div class="info"><span class="tag out">✦ 관계에서의 강점</span><p>' + esc(t.strength) + '</p></div>' +
          '<div class="info grow"><span class="tag in">✦ 한 걸음 더</span><p>' + esc(t.growth) + '</p></div></div>' +
        '</div>' +
        '<div class="pf-rec"><span class="px">' + pixel('flag') + '</span><div><b>이번 학기의 작은 미션</b><p>' + esc(t.mission) + '</p></div></div>' +
        '<p class="pf-note"><span aria-hidden="true">💡</span><span>이 테스트는 재미와 자기 이해를 위한 간이 콘텐츠이며, 심리검사나 진단이 아닙니다. 프로젝트에서 이 결과를 시작으로 진짜 네 이야기를 나눠보자!</span></p>' +
      '</article>';
    box.hidden = false;
    $('#typeChipName').textContent = t.name;
    state.view = k; renderProfile();
    var pl = $('#personal'); if (pl) pl.hidden = true;
    paintChars(document);
    trackEvent('result_revealed', { type: k });
  }

  function onSuccess() {
    state.submitted = true; setLoading(false);
    trackEvent('form_submit_success', { mode: 'live' });
    $('#applyForm').reset();
    $('#applyForm').hidden = true;
    $('.form-head .form-progress').hidden = true;
    var d = $('#doneView'); d.hidden = false;
    revealResult();
    d.scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'start' });
    try { d.focus({ preventScroll: true }); } catch (e) {}
  }

  function initForm() {
    var O = C.FORM_OPTIONS || {}, P = C.PRIVACY || {}, I = C.INFO || {};
    buildOptions('status', O.statuses || [], 'status');
    buildOptions('region', O.regions || [], 'region');
    buildOptions('source', O.sources || [], 'source');
    F.btn = $('#submitBtn');
    var xp = $('#formXp'); for (var i = 0; i < 7; i++) xp.appendChild(document.createElement('i'));
    F.blocks = $$('i', xp);

    // 개인정보 안내 (미설정 값은 플레이스홀더)
    $$('[data-privacy]').forEach(function (el) { var v = (P[el.getAttribute('data-privacy')] || '').trim(); el.innerHTML = v ? esc(v) : '<span class="ph">[운영자가 실제 정책에 맞춰 입력]</span>'; });
    if (isUrl(P.policyUrl)) { $('#policyLink').href = P.policyUrl.trim(); $('#policyLinkWrap').hidden = false; }
    if (!liveMode()) $('#demoBanner').hidden = false;

    // 하단 작은 안내
    var info = [I.costNote || '', '신청 후 전화로 일정 안내'];
    if ((I.place || '').trim()) info.push('장소 ' + I.place.trim());
    if ((I.time || '').trim()) info.push('시간 ' + I.time.trim());
    $('#smallInfo').innerHTML = esc(info.filter(Boolean).join(' · '));

    var form = $('#applyForm');
    form.addEventListener('submit', onSubmit);
    form.addEventListener('focusin', function () { renderPicksNote(); if (!state.formStarted) { state.formStarted = true; trackEvent('form_start', {}); } }, { once: false });
    $('#phone').addEventListener('input', function (e) { var el = e.target; el.value = formatPhone(el.value); });
    $('#phone').addEventListener('blur', function () { if ($('#phone').value) validate('phone'); });
    $('#name').addEventListener('blur', function () { if ($('#name').value) validate('name'); });
    $('#birth').addEventListener('input', function (e) { var el = e.target, v = el.value.replace(/\D/g, '').slice(0, 4); if (el.value !== v) el.value = v; });
    $('#birth').addEventListener('blur', function () { if ($('#birth').value) validate('birth'); });
    $('#referral').addEventListener('blur', function () { validate('ref'); });
    form.addEventListener('change', function (e) {
      var t = e.target;
      if (t.name === 'status') { var on = t.value === '기타'; $('#statusOtherWrap').hidden = !on; if (on) $('#statusOther').focus(); validate('status'); }
      if (t.name === 'source') { var on2 = t.value === '기타'; $('#sourceOtherWrap').hidden = !on2; if (on2) $('#sourceOther').focus(); validate('source'); }
      if (t.name === 'region') { renderRegion(t.value); setErr('region', ''); var first = $('#regionDetail input'); if (first) first.focus(); }
      if (t.name === 'birth') validate('birth');
      if (t.id === 'consent') { $('#consentLabel').classList.toggle('on', t.checked); validate('consent'); }
      progress();
    });
    // 오류가 떠 있는 항목은 입력하는 즉시 다시 확인(오류가 사라질 때 레이아웃이 갑자기 밀리지 않도록)
    var LIVE = { name: 'name', phone: 'phone', birth: 'birth', referral: 'ref', statusOther: 'status', sourceOther: 'source' };
    form.addEventListener('input', function (e) {
      var key = LIVE[e.target.id] || (e.target.getAttribute('data-rk') ? 'region' : null);
      if (key) { var p = $('#' + key + '-err'); if (p && p.classList.contains('show')) validate(key); }
      progress();
    });
    var ta = $('#concern'), cnt = $('#concernCount');
    ta.addEventListener('input', function () { cnt.textContent = ta.value.length; });
    $$('.ex-chips button').forEach(function (b) {
      b.addEventListener('click', function () {
        var ex = b.getAttribute('data-ex'), cur = ta.value.trim();
        if (cur.indexOf(ex) > -1) return;
        ta.value = (cur ? cur + '\n' : '') + ex; ta.value = ta.value.slice(0, 500);
        cnt.textContent = ta.value.length; ta.focus();
      });
    });
    $('#errSummary').addEventListener('click', function (e) {
      var a = e.target.closest('a[data-jump]'); if (!a) return; e.preventDefault();
      var t = $(a.getAttribute('data-jump')); if (t) { t.focus({ preventScroll: true }); t.scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'center' }); }
    });
  }

  function renderMisc() {
    // 테스트를 하고 온 경우에만 하단 고정 버튼을 '결과 보기' 문구로
    if (state.type) $('#stickyBtn').innerHTML = '프로젝트 신청하고 유형 결과 보기 <span class="ar" aria-hidden="true">→</span>';
    if (state.type) { var p = $('#personal'); p.textContent = '감자 유형 분석은 끝났어! 신청을 마치면 네 결과가 바로 공개돼 🔓'; p.hidden = false; $('#unlockNote').hidden = false; }
    var tu = (C.TEST_URL || '').trim();
    if (tu && !/^\s*javascript:/i.test(tu)) {
      var r = $('#retestLink'); r.href = tu; r.hidden = false;
      r.addEventListener('click', function (e) { if (window.__GAON_NAV && !/^(https?|file):$/.test(location.protocol)) { e.preventDefault(); location.reload(); } });
    }
  }

  /* ---------- 스크롤: 등장 · EXP 진행 · 퀘스트 · 고정 CTA ---------- */
  function initScroll() {
    var rv = $$('.rv').concat([$('#bridge')]);
    if (reduce.matches || !('IntersectionObserver' in window)) rv.forEach(function (el) { el.classList.add('in'); });
    else {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
      }, { rootMargin: '0px 0px -8% 0px', threshold: .08 });
      rv.forEach(function (el) { io.observe(el); });
    }
    var xp = $('#xp'), N = 10; for (var i = 0; i < N; i++) xp.appendChild(document.createElement('i'));
    var blocks = $$('i', xp), quest = $('#quest'), rail = $('#rail'), steps = $$('.qstep', quest);
    var sticky = $('#sticky'), sBtn = $('#stickyBtn'), chat = $('#chat'), apply = $('#apply'), ticking = false;

    function update() {
      ticking = false;
      var vh = window.innerHeight, max = document.documentElement.scrollHeight - vh;
      var p = max > 0 ? Math.min(1, window.scrollY / max) : 0, on = Math.round(p * N);
      blocks.forEach(function (b, j) { b.classList.toggle('on', j < on); });
      xp.classList.toggle('full', on >= N);
      var q = quest.getBoundingClientRect();
      rail.style.transform = 'scaleY(' + Math.max(0, Math.min(1, (vh * 0.62 - q.top) / q.height)) + ')';
      steps.forEach(function (s) { if (s.getBoundingClientRect().top < vh * 0.62) s.classList.add('clear'); });
      // 첫 화면 체크리스트를 지나간 뒤부터 표시, 신청 섹션에 들어오면 숨김(폼을 가리지 않도록)
      var a = apply.getBoundingClientRect();
      var show = !state.submitted && chat.getBoundingClientRect().bottom < 0 && a.top > vh * 0.9;
      sticky.classList.toggle('show', show);
      sticky.setAttribute('aria-hidden', String(!show));
      sBtn.tabIndex = show ? 0 : -1;
    }
    window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
    window.addEventListener('resize', update);
    update();
    sBtn.addEventListener('click', function () { trackEvent('application_click', { location: 'sticky' }); smoothTo('#apply'); });
  }

  /* ---------- init ---------- */
  function init() {
    paintChars(document); paintPixels();
    initChat(); initCases(); initProfile(); renderElig(); initWorlds(); initForm(); renderMisc(); initScroll();
    trackEvent('landing_view', { page: 'inner_outer_landing', has_type: !!state.type });
    if (state.type) trackEvent('personality_type_loaded', { type: state.type, type_name: TYPES[state.type].name });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</template>

<script>
  /* 주소의 ?view= 값에 따라 두 화면 중 하나를 그려요 */
  (function () {
    var view = new URLSearchParams(location.search).get('view');
    /* 두 화면 원본을 보관 — 주소 이동이 안 되는 미리보기 창에서는 이걸로 화면을 바꿔요 */
    window.__GAON_PAGES = { test: document.getElementById('page-test').innerHTML, landing: document.getElementById('page-landing').innerHTML };
    document.write(view === 'landing' ? window.__GAON_PAGES.landing : window.__GAON_PAGES.test);
  })();
</script>
